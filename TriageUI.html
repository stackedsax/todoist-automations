<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Todo Triage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3F4F6; --panel:#FFFFFF; --ink:#15181E; --ink2:#4A5160; --ink3:#6B7382;
  --line:#E1E4EA; --hover:#EEF1F5; --cursor:#E6ECF7; --accent:#2F5BD3; --accentInk:#FFFFFF;
  --ok:#1F7A4D; --okBg:#E3F3EA; --warn:#9A5B00; --warnBg:#FBF0DC; --err:#B3261E; --errBg:#FBE4E2; --muted:#EDEFF3;
  --gr:#1E88C9; --isc:#E07B24; --me:#B03A8C; --sg:#5E9E2A; --wait:#7A8291;
  --shadow:0 8px 30px rgba(20,24,32,.14);
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111318; --panel:#191C22; --ink:#E8EAEE; --ink2:#AEB4BF; --ink3:#8A91A0;
    --line:#2A2E36; --hover:#20242B; --cursor:#1F2A40; --accent:#6F95F2; --accentInk:#0D1220;
    --ok:#5CC98E; --okBg:#17302A; --warn:#E3AE5B; --warnBg:#352A17; --err:#F2998F; --errBg:#3A1D1B; --muted:#23272F;
    --gr:#4EAAE6; --isc:#F29A4E; --me:#D66BB4; --sg:#8CC35C; --wait:#8A91A0; --shadow:0 8px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111318; --panel:#191C22; --ink:#E8EAEE; --ink2:#AEB4BF; --ink3:#8A91A0;
  --line:#2A2E36; --hover:#20242B; --cursor:#1F2A40; --accent:#6F95F2; --accentInk:#0D1220;
  --ok:#5CC98E; --okBg:#17302A; --warn:#E3AE5B; --warnBg:#352A17; --err:#F2998F; --errBg:#3A1D1B; --muted:#23272F;
  --gr:#4EAAE6; --isc:#F29A4E; --me:#D66BB4; --sg:#8CC35C; --wait:#8A91A0; --shadow:0 8px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 90px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
.sub{color:var(--ink3);font-size:13px;margin-top:2px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--ink2);padding:5px 10px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer;min-height:32px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .n{font-family:var(--mono);font-size:11px;margin-left:4px;opacity:.75}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.list{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{display:grid;grid-template-columns:22px 18px minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--hover)}
.row.cur{background:var(--cursor);box-shadow:inset 3px 0 0 var(--accent)}
.row.busy{opacity:.6}
.row input{margin:0;accent-color:var(--accent);width:16px;height:16px}
.src{font-family:var(--mono);font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.ico{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:500;color:var(--ink2);background:var(--muted)}
.ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.meta{display:flex;gap:6px;align-items:center;min-width:0;color:var(--ink3);font-size:12px;white-space:nowrap;overflow:hidden}
.meta .o{overflow:hidden;text-overflow:ellipsis}
.dest{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.chip{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--muted);color:var(--ink2);white-space:nowrap}
.chip.warn{background:var(--warnBg);color:var(--warn)}
.chip.wait{background:var(--cursor);color:var(--accent)}
.empty{padding:40px 16px;text-align:center;color:var(--ink3)}
.skel{padding:9px 12px;border-bottom:1px solid var(--line)}
.skel i{display:block;height:10px;border-radius:4px;background:var(--muted);margin:5px 0}
@media (prefers-reduced-motion:no-preference){.skel i{animation:pulse 1.2s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.45}}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow:auto}
.detail h2{font-size:16px;margin:4px 0 8px;font-weight:600;text-wrap:balance;word-break:break-word}
.detail h2[contenteditable="true"]{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.closeDetail{display:none}
@media (max-width:860px){
  .detail{display:none}
  .detail.sheet{display:block;position:fixed;inset:0;top:0;max-height:none;border-radius:0;border:0;z-index:15;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px))}
  .closeDetail{display:inline-flex}
  .row{padding:12px}
}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:14px 0 4px}
.quote{border-left:2px solid var(--line);padding:2px 0 2px 10px;color:var(--ink2);font-size:13px;white-space:pre-wrap;word-break:break-word}
.why{color:var(--ink2);font-size:13px;word-break:break-word}
.destbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
button.act{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 10px;border-radius:6px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:34px}
button.act:hover{background:var(--hover)}
button.act.primary{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
button.act[disabled]{opacity:.5;cursor:default}
button:focus-visible,.tab:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--bg);color:var(--ink2)}
.primary kbd{background:transparent;color:inherit;border-color:rgba(255,255,255,.5)}
@media (hover:none){button.act kbd{display:none}}
.payload{font-family:var(--mono);font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;white-space:pre-wrap;word-break:break-word;color:var(--ink2);margin:0}
a{color:var(--accent)}
.filtered{margin-top:10px;color:var(--ink3);font-size:12.5px}
.filtered ul{margin:6px 0 0;padding-left:18px}
.filtered li{margin:2px 0;word-break:break-word}
.warnbar{margin-bottom:10px;padding:8px 12px;border-radius:6px;background:var(--warnBg);color:var(--warn);font-size:13px}
.legend{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:12px;color:var(--ink2);z-index:5}
.legend span{white-space:nowrap}
@media (max-width:640px){.legend{display:none}.wrap{padding-block:14px 30px}}
.overlay{position:fixed;inset:0;background:rgba(10,12,16,.35);display:grid;place-items:start center;padding:12vh 16px 16px;z-index:20}
.picker{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.picker input{width:100%;border:0;border-bottom:1px solid var(--line);padding:12px 14px;font:inherit;font-size:16px;background:var(--panel);color:var(--ink);outline:none}
.picker .hint{padding:8px 14px;color:var(--ink3);font-size:12.5px}
.opts{max-height:50vh;overflow:auto}
.opt{display:flex;gap:8px;align-items:center;padding:8px 14px;cursor:pointer;font-size:13.5px}
.opt.on{background:var(--cursor)}
.opt .p{color:var(--ink3)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(56px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;box-shadow:var(--shadow);z-index:30;max-width:calc(100% - 32px)}
.toast.err{background:var(--errBg);color:var(--err);border:1px solid var(--err)}
@media (max-width:640px){.toast{bottom:calc(16px + env(safe-area-inset-bottom,0px))}}
.help table{width:100%;border-collapse:collapse;font-size:13px}
.help td{padding:5px 14px;border-bottom:1px solid var(--line)}
.help td:first-child{width:110px;white-space:nowrap}
.done{padding:28px 18px;text-align:center}
.done b{font-size:15px}
.linkbtn{font:inherit;font-size:12.5px;background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}
@media (prefers-reduced-motion:no-preference){.row,.tab,button.act{transition:background .12s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Todo Triage</h1>
      <div class="sub" id="sub">Loading suggestions from meetings, email and Slack…</div>
    </div>
    <button class="act" id="refresh" type="button" title="Reload the queue">Refresh</button>
  </header>

  <div id="warn"></div>
  <div class="tabs" id="tabs" role="toolbar" aria-label="Filter by source"></div>

  <div class="grid">
    <div>
      <div class="list" id="list" role="listbox" aria-label="Suggestions" aria-busy="true"></div>
      <div class="filtered" id="filtered"></div>
    </div>
    <aside class="detail" id="detail" aria-live="polite"></aside>
  </div>
</div>

<div class="legend" aria-hidden="true">
  <span><kbd>j</kbd>/<kbd>k</kbd> move</span>
  <span><kbd>x</kbd> select</span>
  <span><kbd>s</kbd> accept</span>
  <span><kbd>1</kbd>–<kbd>4</kbd> GR · ISC · Me · SG</span>
  <span><kbd>v</kbd> project/section</span>
  <span><kbd>w</kbd> waiting on others</span>
  <span><kbd>e</kbd> dismiss</span>
  <span><kbd>u</kbd> not a duplicate</span>
  <span><kbd>o</kbd> open source</span>
  <span><kbd>Enter</kbd> edit</span>
  <span><kbd>z</kbd> undo</span>
  <span><kbd>f</kbd> filtered</span>
  <span><kbd>Esc</kbd> clear selection</span>
  <span><kbd>?</kbd> help</span>
</div>

<div id="layer"></div>

<script>
(function(){
"use strict";
var COLORS={GR:"var(--gr)",ISC:"var(--isc)",Me:"var(--me)",SG:"var(--sg)",Waiting:"var(--wait)",Inbox:"var(--ink3)"};
var QUICK=["GR","ISC","Me","SG"];
var SRC={meeting:{label:"Meetings",ico:"M"},email:{label:"Email",ico:"@"},slack:{label:"Slack",ico:"#"},system:{label:"Checks",ico:"!"}};
var LABEL={meeting:"meeting",email:"from-email",slack:"from-slack",system:"check"};
var REASONS={replied:"you'd already replied",calendar:"calendar replies",noreply:"automated senders",receipt:"receipts and invoices",mailing_list:"mailing lists"};
var DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

var items=[], sections={GR:[],ISC:[],Me:[],SG:[]}, filtered=null;
var state="loading", loadError="";
var filter="all", cursor=0, selected={}, undoStack=[], editing=false, overlay=null, showFiltered=false, sheetOpen=false;

function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function clone(o){return JSON.parse(JSON.stringify(o))}
function trunc(s,n){s=String(s||"");return s.length>n?s.slice(0,n-1)+"…":s}
function isMobile(){return window.matchMedia&&window.matchMedia("(max-width:860px)").matches}
function dayLabel(iso){
  if(!iso)return "";
  var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso)); if(!m)return String(iso);
  var d=new Date(+m[1],+m[2]-1,+m[3]);
  return DAYS[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()];
}
function server(){
  if(!(window.google&&google.script&&google.script.run))return null;
  return google.script.run;
}
function call(fn,args,ok,fail){
  var r=server();
  if(!r){fail(new Error("Not connected to Apps Script (open this page from the deployed web app URL)"));return}
  var runner=r.withSuccessHandler(ok).withFailureHandler(function(e){fail(e||new Error("Unknown error"))});
  runner[fn].apply(runner,args);
}
function errMsg(e){return (e&&e.message)?e.message:String(e)}

// ---------------------------------------------------------------- call queue (begin)
// Bulk actions go through this queue: at most MAX_INFLIGHT server executions at once. Apps Script
// allows 30 simultaneous executions per user, and each triageAct loads the whole state sheet, so
// firing one call per selected item at once fails part of a large (backfill) batch.
// https://developers.google.com/apps-script/guides/services/quotas
var MAX_INFLIGHT=4, inflight=0, callQueue=[];
function queuedCall(fn,args,ok,fail){
  callQueue.push({fn:fn,args:args,ok:ok,fail:fail});
  pumpCalls();
}
function pumpCalls(){
  while(inflight<MAX_INFLIGHT&&callQueue.length){
    startCall(callQueue.shift());
  }
}
function startCall(c){
  var settled=false;
  inflight++;
  var fin=function(h,x){ if(settled)return; settled=true; inflight--; try{h(x)}finally{pumpCalls()} };
  try{ call(c.fn,c.args,function(r){fin(c.ok,r)},function(e){fin(c.fail,e)}) }catch(e){ fin(c.fail,e) }
}
// ---------------------------------------------------------------- call queue (end)

// ---------------------------------------------------------------- model helpers
function isWaiting(i){return i.kind==="waiting"||i.project==="Waiting"}
function isDup(i){return !!i.dupTaskId&&!i.notDuplicate}
function chipsFor(i){
  var c=[]; if(isDup(i))c.push("Possible duplicate");
  (i.chips||[]).forEach(function(x){if(x!=="Possible duplicate"&&c.indexOf(x)<0)c.push(x)});
  if(i.confidence==="low"&&c.indexOf("Low confidence")<0)c.push("Low confidence");
  return c;
}
function destText(i){
  if(isWaiting(i))return "Waiting · back "+(i.resurface?dayLabel(i.resurface):"in 7 days");
  if(isDup(i))return "Comment on existing task";
  if(!i.project)return "Inbox (no project yet)";
  return i.project+(i.section?" › "+i.section:"");
}
function destHTML(i){
  var col=isWaiting(i)?COLORS.Waiting:isDup(i)?"var(--ink3)":(COLORS[i.project]||COLORS.Inbox);
  return '<span class="dest"><span class="dot" style="background:'+col+'"></span>'+esc(destText(i))+'</span>';
}
function pending(){return items.filter(function(i){return i.status==="pending"})}
function visible(){
  return pending().filter(function(i){
    if(filter==="all")return true;
    if(filter==="waiting")return isWaiting(i);
    return i.source===filter;
  });
}
function byId(id){for(var n=0;n<items.length;n++)if(items[n].id===id)return items[n];return null}
function replaceItem(fresh){
  for(var n=0;n<items.length;n++)if(items[n].id===fresh.id){items[n]=fresh;return}
  items.push(fresh);
}
function tallies(){
  var t={accepted:0,waiting:0,dismissed:0};
  items.forEach(function(i){ if(t[i.status]!==undefined)t[i.status]++; });
  return t;
}
function selIds(){return Object.keys(selected).filter(function(k){return selected[k]})}

// ---------------------------------------------------------------- rendering
function renderHeader(){
  var now=new Date();
  var date=now.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
  var n=pending().length;
  $("#sub").textContent=state==="loading"?"Loading suggestions from meetings, email and Slack…":
    state==="error"?"Could not load the queue":
    date+" · "+(n?n+" suggestion"+(n===1?"":"s")+" from meetings, email and Slack":"nothing waiting for you");
}
function renderTabs(){
  var pend=pending();
  var count=function(f){return pend.filter(f).length};
  var defs=[["all","All",pend.length],["meeting","Meetings",count(function(i){return i.source==="meeting"})],["email","Email",count(function(i){return i.source==="email"})],["slack","Slack",count(function(i){return i.source==="slack"})],["waiting","Waiting on others",count(isWaiting)],["system","Checks",count(function(i){return i.source==="system"})]];
  $("#tabs").innerHTML=state!=="ready"?"":defs.map(function(d){return '<button class="tab" type="button" data-f="'+d[0]+'" aria-pressed="'+(filter===d[0])+'">'+d[1]+'<span class="n">'+d[2]+'</span></button>'}).join("");
  Array.prototype.forEach.call($("#tabs").querySelectorAll(".tab"),function(b){b.onclick=function(){filter=b.getAttribute("data-f");cursor=0;render()}});
}
function renderList(){
  var L=$("#list");
  L.setAttribute("aria-busy",state==="loading"?"true":"false");
  if(state==="loading"){
    var s="";for(var n=0;n<5;n++)s+='<div class="skel"><i style="width:'+(55+n*7%40)+'%"></i><i style="width:35%"></i></div>';
    L.innerHTML=s;return;
  }
  if(state==="error"){
    L.innerHTML='<div class="empty"><b>Could not load suggestions.</b><div class="sub" style="margin-top:6px">'+esc(loadError)+'</div><div style="margin-top:12px"><button class="act" type="button" id="retry">Try again</button></div></div>';
    $("#retry").onclick=load;return;
  }
  var v=visible();
  if(cursor>=v.length)cursor=Math.max(0,v.length-1);
  if(!v.length){
    var any=pending().length;
    var session=tallies(), tally=session.accepted+session.waiting+session.dismissed;
    L.innerHTML='<div class="done"><b>'+(any?"Nothing left in this view.":"All caught up.")+'</b><div class="sub" style="margin-top:6px">'+
      (tally?"This session: "+session.accepted+" accepted, "+session.waiting+" parked as waiting, "+session.dismissed+" dismissed. Press <kbd>z</kbd> to undo the last one.":
      (any?"Other tabs still have suggestions.":"New suggestions appear here after the next meeting, email or Slack run."))+'</div></div>';
    return;
  }
  L.innerHTML=v.map(function(i,idx){
    return '<div class="row'+(idx===cursor?" cur":"")+(i._busy?" busy":"")+'" role="option" aria-selected="'+(idx===cursor)+'" data-idx="'+idx+'">'+
      '<input type="checkbox" aria-label="Select" '+(selected[i.id]?"checked":"")+'>'+
      '<span class="ico" title="'+esc((SRC[i.source]||{label:i.source}).label)+'">'+esc((SRC[i.source]||{ico:"?"}).ico)+'</span>'+
      '<div style="min-width:0"><div class="ttl">'+esc(i.title)+'</div>'+
      '<div class="meta"><span class="o">'+esc(i.origin||"")+'</span>'+chipsFor(i).map(function(c){return ' <span class="chip'+((c==="Possible duplicate"||c==="Low confidence")?" warn":"")+'">'+esc(c)+'</span>'}).join("")+'</div></div>'+
      '<div>'+destHTML(i)+'</div></div>';
  }).join("");
  Array.prototype.forEach.call(L.querySelectorAll(".row"),function(r){
    var idx=+r.getAttribute("data-idx");
    r.onclick=function(e){
      if(e.target.tagName==="INPUT"){toggleSel(v[idx].id);return}
      cursor=idx; if(isMobile())sheetOpen=true; render();
    };
  });
  var cur=L.querySelector(".row.cur"); if(cur&&cur.scrollIntoView&&!isMobile())cur.scrollIntoView({block:"nearest"});
}
function payload(i){
  if(isWaiting(i))return "Project: Waiting on others (hidden)\nOwner: "+(i.waitOn||"(owner unknown)")+"\nResurface: "+(i.resurface?dayLabel(i.resurface):"in 7 days")+", as a follow-up in "+(i.project?i.project+(i.section?" › "+i.section:""):"Inbox")+"\nAuto-close: yes, if later email, Slack or meetings show it's done"+(i.link?"\nLink: "+i.link:"");
  if(isDup(i))return "No new task. Adds a comment to the existing task:\n“"+(i.dupTaskTitle||"")+"”\n+ a link back to the source";
  var q=String(i.quote||"");
  return "Task: "+i.title+(i.due?"\nDue: "+dayLabel(i.due):"")+"\nProject: "+(i.project?i.project+(i.section?" › "+i.section:""):"Inbox")+"\nLabel: @"+(LABEL[i.source]||"meeting")+"\nDescription:\n  "+(i.origin||"")+"\n  "+(i.link||"(no link)")+(q?"\n  “"+trunc(q,90)+"”":"");
}
function whyText(i){
  if(i.dupTaskId&&i.notDuplicate)return "You marked this as not a duplicate, so accepting creates a new task.";
  var w=i.why||"";
  if(isDup(i))w=(w?w+" ":"")+"Looks like your existing task “"+(i.dupTaskTitle||"")+"”. Accepting adds this as a comment on it instead of creating a new one.";
  return w||"—";
}
function renderDetail(){
  var D=$("#detail");
  D.className="detail"+(sheetOpen&&isMobile()?" sheet":"");
  if(state!=="ready"){D.innerHTML='<div class="empty">'+(state==="loading"?"Loading…":"—")+'</div>';return}
  var v=visible(), i=v[cursor];
  if(!i){D.innerHTML='<div class="empty">Select a suggestion to see where it came from.</div>';sheetOpen=false;D.className="detail";return}
  var src=i.link?'<a href="'+esc(i.link)+'" target="_blank" rel="noopener" id="srclink">Open source ↗</a>':'<span class="sub">No link</span>';
  var dupLink=isDup(i)&&i.dupTaskUrl?' <a href="'+esc(i.dupTaskUrl)+'" target="_blank" rel="noopener">Open existing task ↗</a>':"";
  D.innerHTML=
    '<div class="dhead"><div class="src">'+esc((SRC[i.source]||{label:i.source}).label)+' · confidence '+esc(i.confidence||"?")+(i.routeConfidence?' · route '+esc(i.routeConfidence):'')+'</div>'+
    '<button class="act closeDetail" type="button" id="closeSheet" aria-label="Back to list">Back</button></div>'+
    '<h2 id="dtitle" spellcheck="false">'+esc(i.title)+'</h2>'+
    '<div class="destbox">'+destHTML(i)+(isWaiting(i)?' <span class="chip wait">Owner: '+esc(i.waitOn||"unknown")+'</span>':"")+(i.due?' <span class="chip">Due '+esc(dayLabel(i.due))+'</span>':"")+chipsFor(i).map(function(c){return ' <span class="chip'+((c==="Possible duplicate"||c==="Low confidence")?" warn":"")+'">'+esc(c)+'</span>'}).join("")+'</div>'+
    '<div class="lbl">From</div><div class="why">'+esc(i.origin||"")+' · '+src+'</div>'+
    (i.quote?'<div class="lbl">What it said</div><div class="quote">'+esc(i.quote)+'</div>':"")+
    '<div class="lbl">Why it\'s here</div><div class="why">'+esc(whyText(i))+dupLink+'</div>'+
    '<div class="btnrow">'+
      '<button class="act primary" type="button" data-a="accept"><kbd>s</kbd> Accept</button>'+
      '<button class="act" type="button" data-a="move"><kbd>v</kbd> Project/section</button>'+
      '<button class="act" type="button" data-a="wait"><kbd>w</kbd> Waiting</button>'+
      '<button class="act" type="button" data-a="edit"><kbd>↵</kbd> Edit</button>'+
      (i.dupTaskId?'<button class="act" type="button" data-a="undup"><kbd>u</kbd> '+(i.notDuplicate?"Mark as duplicate again":"Not a duplicate")+'</button>':"")+
      '<button class="act" type="button" data-a="dismiss"><kbd>e</kbd> Dismiss</button>'+
      (undoStack.length?'<button class="act" type="button" data-a="undo"><kbd>z</kbd> Undo</button>':"")+
    '</div>'+
    '<div class="lbl">What accepting does</div><pre class="payload">'+esc(payload(i))+'</pre>';
  Array.prototype.forEach.call(D.querySelectorAll("button.act[data-a]"),function(b){
    b.disabled=!!i._busy&&b.getAttribute("data-a")!=="undo";
    b.onclick=function(){var a=b.getAttribute("data-a"); if(a==="undo")doUndo(); else act(a)};
  });
  var cs=$("#closeSheet"); if(cs)cs.onclick=function(){sheetOpen=false;render()};
}
function renderFiltered(){
  var F=$("#filtered");
  if(state!=="ready"){F.innerHTML="";return}
  var f=filtered||{count:0,examples:[]};
  if(!f.at){F.innerHTML="The inbox sweep hasn't run yet, so no emails have been filtered.";return}
  var when=new Date(f.at), whenTxt=isNaN(when)?"":" in the "+DAYS[when.getDay()]+" "+when.getDate()+" "+MONTHS[when.getMonth()]+" sweep";
  if(!f.count){F.innerHTML="No emails were filtered out"+esc(whenTxt)+".";return}
  var parts=Object.keys(f.byReason||{}).filter(function(k){return f.byReason[k]}).map(function(k){return f.byReason[k]+" "+(REASONS[k]||k.replace(/_/g," "))});
  var head="Filtered out before you saw them"+esc(whenTxt)+": "+f.count+" email"+(f.count===1?"":"s")+(parts.length?" ("+esc(parts.join(", "))+")":"")+".";
  if(!showFiltered){
    F.innerHTML=head+' <button class="linkbtn" type="button" id="ftoggle">Show them</button> or press <kbd>f</kbd>.';
  }else{
    var ex=(f.examples||[]).map(function(x){return "<li>“"+esc(x.subject||"(no subject)")+"”"+(x.from?" · "+esc(x.from):"")+(x.reason?' <span class="chip">'+esc(REASONS[x.reason]||x.reason)+'</span>':"")+"</li>"}).join("");
    F.innerHTML=head+' <button class="linkbtn" type="button" id="ftoggle">Hide</button> or press <kbd>f</kbd>.'+(ex?"<ul>"+ex+"</ul>"+(f.count>(f.examples||[]).length?'<div>…and '+(f.count-f.examples.length)+" more.</div>":""):"<div>No examples were saved.</div>");
  }
  $("#ftoggle").onclick=function(){showFiltered=!showFiltered;renderFiltered()};
}
function render(){renderHeader();renderTabs();renderList();renderDetail();renderFiltered()}

// ---------------------------------------------------------------- toast
var toastTimer=null;
function toast(msg,isErr){
  var old=document.querySelector(".toast"); if(old)old.remove();
  if(toastTimer)clearTimeout(toastTimer);
  var t=document.createElement("div");t.className="toast"+(isErr?" err":"");t.setAttribute("role",isErr?"alert":"status");t.textContent=msg;
  document.body.appendChild(t);toastTimer=setTimeout(function(){t.remove()},isErr?6000:2600);
}

// ---------------------------------------------------------------- server actions (optimistic)
/**
 * Apply `local` to each item now, then call triageAct(id, action, patchFor(item)) through the call queue.
 * Success replaces the item with the server's copy; failure restores the snapshot and toasts.
 * A server no-op (res.changed === false) pushed no server undo record, so it is left out of the
 * page's undo entry too (otherwise z would pop an older, unrelated server record).
 */
function runAction(list,action,patchFor,local,okMsg,opts){
  opts=opts||{};
  if(!list.length)return;
  var snaps=list.map(function(i){return clone(i)});
  var patches=list.map(function(i){return patchFor?patchFor(i):null});
  list.forEach(function(i){local(i);i._busy=true});
  var entry=opts.noUndo?null:{action:action,ids:list.map(function(i){return i.id}),snaps:snaps};
  if(entry)undoStack.push(entry);
  selected={};
  if(opts.closeSheet!==false)sheetOpen=false;
  render();
  if(okMsg)toast(okMsg);
  var okIds=[],noops=[],left=list.length;
  list.forEach(function(i,n){
    queuedCall("triageAct",[i.id,action,patches[n]],function(res){
      var fresh=res&&res.item;
      if(fresh)replaceItem(fresh); else {var it=byId(i.id); if(it)delete it._busy}
      if(res&&res.changed===false)noops.push(res.message||"No change"); else okIds.push(i.id);
      done();
    },function(e){
      var s=clone(snaps[n]); delete s._busy; replaceItem(s);
      toast("Couldn't "+action+" “"+trunc(s.title,40)+"”: "+errMsg(e),true);
      done();
    });
  });
  function done(){
    if(--left)return;
    if(entry){
      // Only successful changes can be undone; failed ones were already rolled back.
      entry.ids=okIds.slice();
      entry.snaps=entry.snaps.filter(function(x){return okIds.indexOf(x.id)>=0});
      if(!entry.ids.length){var at=undoStack.indexOf(entry); if(at>=0)undoStack.splice(at,1)}
    }
    if(noops.length&&!okIds.length&&list.length===1)toast(noops[0]);
    render();
  }
}

function targets(){
  var ids=selIds();
  if(ids.length)return items.filter(function(i){return selected[i.id]&&i.status==="pending"&&!i._busy});
  var i=visible()[cursor];
  return i&&!i._busy?[i]:[];
}
function toggleSel(id){if(selected[id])delete selected[id];else selected[id]=true;render()}
function label1(t){return t.length>1?t.length+" items":"“"+trunc(t[0].title,48)+"”"}

function act(a){
  if(state!=="ready")return;
  var t=targets();
  if(!t.length){ if(visible()[cursor]&&visible()[cursor]._busy)toast("Still saving that one…"); return; }
  if(a==="accept"){
    var one=t.length===1?"Accepted → "+destText(t[0]).replace(/^Comment on existing task$/,"a comment on the existing task").replace(/^Waiting · /,"Waiting on others, "):"Accepted "+t.length+" items, each to its destination";
    runAction(t,"accept",null,function(i){
      i.status=isWaiting(i)?"waiting":"accepted";
    },one+" · z to undo");
  }
  else if(a==="dismiss"){
    runAction(t,"dismiss",null,function(i){i.status="dismissed"},"Dismissed "+label1(t)+" · z to undo");
  }
  else if(a==="wait"){
    var needOwner=t.filter(function(i){return !i.waitOn});
    if(needOwner.length)askOwner(t);
    else parkWaiting(t,null);
  }
  else if(a==="undup"){
    var d=t.filter(function(i){return i.dupTaskId});
    if(!d.length){toast("This one isn't flagged as a duplicate");return}
    var toNot=!d[0].notDuplicate;
    runAction(d,"undup",function(){return {notDuplicate:toNot}},function(i){i.notDuplicate=toNot},
      toNot?"Not a duplicate: accepting will create a new task":"Flagged as a duplicate again",{closeSheet:false});
  }
  else if(a==="move") openPicker(t);
  else if(a==="edit") startEdit();
}
function parkWaiting(t,owner){
  runAction(t,"wait",function(i){return owner?{waitOn:owner}:{}},function(i){
    if(owner)i.waitOn=owner; i.kind="waiting"; i.status="waiting";
  },"Parked "+(t.length>1?t.length+" items":"1 item")+" in Waiting on others · z to undo");
}
function quickProject(k){
  var t=targets(); if(!t.length)return;
  var move=t.filter(function(i){return isWaiting(i)||i.project!==k});
  if(!move.length){toast("Already in "+k+". Press s to accept, or v to pick a section");return}
  runAction(move,"move",function(){return {project:k}},function(i){
    var keep=i.section&&(sections[k]||[]).indexOf(i.section)>=0;
    i.kind="todo"; i.project=k; i.section=keep?i.section:null;
  },"Moved to "+k+(move.length===1&&move[0].section?" › "+move[0].section:"")+". Press s to accept, or v to pick a section",{closeSheet:false});
}

function doUndo(){
  var last=undoStack.pop(); if(!last){toast("Nothing to undo");return}
  var list=last.ids.map(byId).filter(Boolean);
  if(list.some(function(i){return i._busy})){undoStack.push(last);toast("Still saving… try undo again in a moment");return}
  var before=list.map(function(i){return clone(i)});
  list.forEach(function(i){
    var s=null; last.snaps.forEach(function(x){if(x.id===i.id)s=x});
    if(s){var c=clone(s); c._busy=true; replaceItem(c)}
  });
  render();
  var left=list.length, failed=0;
  list.forEach(function(i,n){
    queuedCall("triageAct",[i.id,"undo",null],function(res){
      if(res&&res.item)replaceItem(res.item); else {var it=byId(i.id); if(it)delete it._busy}
      if(!--left)finish();
    },function(e){
      failed++; var b=before[n]; delete b._busy; replaceItem(b);
      toast("Couldn't undo “"+trunc(b.title,40)+"”: "+errMsg(e),true);
      if(!--left)finish();
    });
  });
  function finish(){ if(!failed)toast("Undone"); render(); }
}

// ---------------------------------------------------------------- editing
function startEdit(){
  var h=$("#dtitle"); if(!h)return;
  var i=visible()[cursor]; if(!i||i._busy)return;
  if(isMobile()&&!sheetOpen){sheetOpen=true;render();h=$("#dtitle")}
  editing=true;h.contentEditable="true";h.focus();
  try{var r=document.createRange();r.selectNodeContents(h);var s=window.getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}
  var finish=function(save){
    if(!editing)return; editing=false;h.contentEditable="false";
    var v=h.textContent.replace(/\s+/g," ").trim();
    if(save&&v&&v!==i.title){
      runAction([i],"edit",function(){return {title:v}},function(x){x.title=v},"Saved · z to undo",{closeSheet:false});
    }else render();
  };
  h.onkeydown=function(e){ if(e.key==="Enter"){e.preventDefault();finish(true)} else if(e.key==="Escape"){e.preventDefault();finish(false)} e.stopPropagation(); };
  h.onblur=function(){finish(true)};
}

// ---------------------------------------------------------------- overlays
function closeOverlay(){$("#layer").innerHTML="";overlay=null}
function openPicker(t){
  var opts=[];
  QUICK.forEach(function(k){
    opts.push({k:k,sec:"",label:k,path:"project root"});
    (sections[k]||[]).forEach(function(s){opts.push({k:k,sec:s,label:s,path:k})});
  });
  opts.push({k:"Waiting",sec:"",label:"Waiting on others",path:"hidden until the resurface date"});
  var q="",on=0;
  $("#layer").innerHTML='<div class="overlay" id="ov"><div class="picker" role="dialog" aria-label="Choose project and section"><input id="pq" placeholder="Type a project or section…" autocomplete="off" aria-label="Filter projects and sections"><div class="opts" id="po" role="listbox"></div></div></div>';
  overlay="picker";
  var inp=$("#pq"), box=$("#po");
  var list=function(){var ql=q.toLowerCase();return opts.filter(function(o){return (o.label+" "+o.path).toLowerCase().indexOf(ql)>=0})};
  var choose=function(o){
    if(!o)return; closeOverlay();
    if(o.k==="Waiting"){
      runAction(t,"move",function(){return {project:"Waiting"}},function(i){i.kind="waiting"},"Destination set: Waiting on others. Press s to accept",{closeSheet:false});
      return;
    }
    runAction(t,"move",function(){return {project:o.k,section:o.sec||null}},function(i){i.kind="todo";i.project=o.k;i.section=o.sec||null},
      "Destination set: "+o.k+(o.sec?" › "+o.sec:"")+". Press s to accept",{closeSheet:false});
  };
  var draw=function(){
    var l=list(); if(on>=l.length)on=Math.max(0,l.length-1);
    box.innerHTML=l.map(function(o,n){return '<div class="opt'+(n===on?" on":"")+'" role="option" data-n="'+n+'"><span class="dot" style="background:'+COLORS[o.k]+'"></span>'+esc(o.label)+' <span class="p">· '+esc(o.path)+'</span></div>'}).join("")||'<div class="opt p">No match</div>';
    Array.prototype.forEach.call(box.querySelectorAll(".opt[data-n]"),function(el){el.onclick=function(){choose(list()[+el.getAttribute("data-n")])}});
    var c=box.querySelector(".on"); if(c&&c.scrollIntoView)c.scrollIntoView({block:"nearest"});
  };
  inp.oninput=function(){q=inp.value;on=0;draw()};
  inp.onkeydown=function(e){
    if(e.key==="ArrowDown"||(e.ctrlKey&&e.key==="n")){e.preventDefault();on++;draw()}
    else if(e.key==="ArrowUp"||(e.ctrlKey&&e.key==="p")){e.preventDefault();on=Math.max(0,on-1);draw()}
    else if(e.key==="Enter"){e.preventDefault();choose(list()[on])}
    else if(e.key==="Escape"){e.preventDefault();closeOverlay()}
    e.stopPropagation();
  };
  $("#ov").onclick=function(e){if(e.target.id==="ov")closeOverlay()};
  draw();inp.focus();
}
function askOwner(t){
  var guess=t.length===1?(t[0].waitOn||""):"";
  $("#layer").innerHTML='<div class="overlay" id="ov"><div class="picker" role="dialog" aria-label="Waiting on whom"><input id="pq" placeholder="Who owes you this? (optional)" autocomplete="off" aria-label="Waiting on whom" value="'+esc(guess)+'"><div class="hint">Enter to park in Waiting on others · Esc to cancel</div></div></div>';
  overlay="owner";
  var inp=$("#pq");
  inp.onkeydown=function(e){
    if(e.key==="Enter"){e.preventDefault();var v=inp.value.trim();closeOverlay();parkWaiting(t,v||null)}
    else if(e.key==="Escape"){e.preventDefault();closeOverlay()}
    e.stopPropagation();
  };
  $("#ov").onclick=function(e){if(e.target.id==="ov")closeOverlay()};
  inp.focus();
}
function openHelp(){
  var rows=[["j / k","Next / previous suggestion"],["x","Select (actions apply to all selected)"],["s","Accept into the suggested project and section"],["1 2 3 4","Change project to GR, ISC, Me or SG"],["v","Pick any project and section (type to filter)"],["w","Park in Waiting on others"],["e","Dismiss, like Gmail's archive (feeds back to reduce noise)"],["u","Not a duplicate: create a new task instead of a comment"],["o","Open the original email, thread or note"],["Enter","Edit the task wording"],["z","Undo"],["f","Show what was filtered out"],["Esc","Clear selection, or close this"],["?","This help"]];
  $("#layer").innerHTML='<div class="overlay" id="ov"><div class="picker help" role="dialog" aria-label="Keyboard shortcuts"><div style="padding:12px 14px;font-weight:600">Keyboard shortcuts</div><table>'+rows.map(function(r){return '<tr><td><kbd>'+r[0]+'</kbd></td><td>'+r[1]+'</td></tr>'}).join("")+'</table></div></div>';
  overlay="help"; $("#ov").onclick=closeOverlay;
}

// ---------------------------------------------------------------- keyboard
document.addEventListener("keydown",function(e){
  if(editing)return;
  if(overlay){ if(e.key==="Escape"){e.preventDefault();closeOverlay()} return; }
  if(e.key==="Escape"){
    if(selIds().length){e.preventDefault();selected={};toast("Selection cleared");render()}
    else if(sheetOpen){e.preventDefault();sheetOpen=false;render()}
    return;
  }
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var tag=(e.target.tagName||"").toLowerCase(); if((tag==="input"&&e.target.type!=="checkbox")||tag==="textarea"||e.target.isContentEditable)return;
  if(state!=="ready")return;
  var v=visible(), k=e.key;
  var handled=function(){e.preventDefault()};
  if(k==="j"||k==="ArrowDown"){handled();cursor=Math.min(Math.max(0,v.length-1),cursor+1);render()}
  else if(k==="k"||k==="ArrowUp"){handled();cursor=Math.max(0,cursor-1);render()}
  else if(k==="x"){handled(); if(v[cursor])toggleSel(v[cursor].id)}
  else if(k==="s"){handled();act("accept")}
  else if(k==="u"){handled();act("undup")}
  else if(k==="e"){handled();act("dismiss")}
  else if(k==="w"){handled();act("wait")}
  else if(k==="v"){handled();act("move")}
  else if(k==="Enter"){ if(tag==="button"||tag==="a")return; handled();act("edit")}
  else if(k==="z"){handled();doUndo()}
  else if(k==="1"||k==="2"||k==="3"||k==="4"){handled();quickProject(QUICK[+k-1])}
  else if(k==="o"){handled(); var a=$("#srclink"); if(a)window.open(a.href,"_blank","noopener"); else toast("No link for this one")}
  else if(k==="?"){handled();openHelp()}
  else if(k==="f"){handled();showFiltered=!showFiltered;renderFiltered(); var F=$("#filtered"); if(showFiltered&&F.scrollIntoView)F.scrollIntoView({block:"nearest"})}
});

// ---------------------------------------------------------------- load
function load(){
  state="loading"; render();
  call("triageList",[],function(res){
    res=res||{};
    items=(res.items||[]).map(function(i){i.status=i.status||"pending";return i});
    sections=res.sections||sections;
    filtered=res.filtered||null;
    selected={}; undoStack=[]; cursor=0;
    $("#warn").innerHTML=(res.warnings||[]).map(function(w){return '<div class="warnbar">'+esc(w)+'</div>'}).join("");
    state="ready"; render();
  },function(e){
    loadError=errMsg(e); state="error"; render();
  });
}
$("#refresh").onclick=function(){
  if(items.some(function(i){return i._busy})){toast("Still saving… refresh in a moment");return}
  load();
};
window.addEventListener("resize",function(){ if(!isMobile()&&sheetOpen){sheetOpen=false;renderDetail()} });
load();
})();
</script>
